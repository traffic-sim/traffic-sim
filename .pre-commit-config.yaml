repos:
  - repo: local
    hooks:
      # ── C++ ──────────────────────────────────────────────────
      # fmt-cpp runs clang-format -i on all staged C++ files.
      - id: fmt-cpp
        name: just fmt-cpp
        entry: just fmt-cpp
        language: system
        types_or: [c, c++]
        pass_filenames: false

      # check-cpp runs clang-format --dry-run + clang-tidy.
      # Needs compile_commands.json - run `just cmake-configure` after cloning.
      - id: check-cpp
        name: just check-cpp
        entry: just check-cpp
        language: system
        types_or: [c, c++]
        pass_filenames: false

      # ── Rust ─────────────────────────────────────────────────
      # fmt-rust formats both crates; check-rust runs rustfmt --check + clippy.
      - id: fmt-rust
        name: just fmt-rust
        entry: just fmt-rust
        language: system
        types: [rust]
        pass_filenames: false

      - id: check-rust
        name: just check-rust
        entry: just check-rust
        language: system
        types: [rust]
        pass_filenames: false

      # ── Frontend ─────────────────────────────────────────────
      - id: fmt-frontend
        name: just fmt-frontend
        entry: just fmt-frontend
        language: system
        types_or: [ts, tsx, json, css, markdown]
        pass_filenames: false

      - id: check-frontend
        name: just check-frontend
        entry: just check-frontend
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
